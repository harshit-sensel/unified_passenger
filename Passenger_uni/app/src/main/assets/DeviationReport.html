<!DOCTYPE html>
<html>
<head>
    <title>Drawing tools</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
         /* Always set the map height explicitly to define the size of the div
        * element that contains the map. */
         #map {
             height: 100%;
         }
         /* Optional: Makes the sample page fill the window. */
         html, body {
             height: 100%;
             margin: 0;
             padding: 0;
         }
    </style>
    <style>
        html, body, #map {
            height: 100%;
            margin: 0px;
            padding: 0px
        }

        #panel {
            position: absolute;
            top: 5px;
            left: 50%;
            margin-left: -180px;
            z-index: 5;
            background-color: #fff;
            padding: 5px;
            border: 1px solid #999;
        }

        #bar {
            width: 240px;
            background-color: rgba(255, 255, 255, 0.75);
            margin: 8px;
            padding: 4px;
            border-radius: 4px;
        }

        #autoc {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
    <script src="https://apis.mapmyindia.com/advancedmaps/v1/9bzttjsyzyp9nt5zv64xhmkhulvjgow1/map_load?v=1.3" type="text/javascript"></script>

</head>
<body>
<div id="map"></div>

<script>
        // This example requires the Drawing library. Include the libraries=drawing
        // parameter when you first load the API. For example:

        var all_markers = [];

        var cLatLong = JSInterface.GetPlace();
        initMap();
        function initMap() {
            if (!cLatLong) {
                cLatLong = JSInterface.GetLocation();
            }
            var res = cLatLong.split(",");
            LatLng = new L.LatLng(res[0], res[1]);
            var map = new MapmyIndia.Map(document.getElementById('map'), {
                center: LatLng,
                zoom: 16,
                search: false,
                location: false
            });
            map.on("click", function (e) {
                var pt = e.latlng;
                JSInterface.setPlace(pt.lat + "," + pt.lng);

                var marker = L.divIcon({
                    className: 'my-div-icon',
                    html: '<img  src="gps.png"/>',
                    iconSize: [1, 1],
                    popupAnchor: [12, -10]
                });
                center = new L.LatLng(pt.lat, pt.lng);
                if (all_markers.length > 0) {
                    map.removeLayer(all_markers[0]);
                    all_markers = [];
                }
                all_markers.push(addMarker(center, marker, 'Selected Point'));
            });

            function addMarker(position, icon, title) {
                var mk;
                if (icon === '') {
                    mk = new L.Marker(position, { draggable: false, title: title });/*marker with a default icon and optional param draggable, title */
                    mk.bindPopup(title);
                } else {
                    mk = new L.Marker(position, { icon: icon, draggable: false, title: title });/*marker with a custom icon */
                    mk.bindPopup(title);
                }
                map.addLayer(mk);/*add the marker to the map*/

                return mk;
            }
        }



    </script>
</body>
</html>
